[package]
name = "lantern"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[dependencies]
rune = { git = "https://github.com/anomalyco/rune", rev = "4a2e437954f01eaacc13c0515a1d39474dd6512c", features = ["tooling"] }
# Drawn menus, selects and overlays (Rune's native menus are macOS and Windows only).
rune-kit = { git = "https://github.com/anomalyco/rune", rev = "4a2e437954f01eaacc13c0515a1d39474dd6512c" }
wgpu = { version = "~30.0.1", default-features = false, features = ["std", "parking_lot", "wgsl", "vulkan"] }
bytemuck = { version = "1.25", features = ["derive"] }
glam = { version = "0.30", features = ["bytemuck"] }
# Foxglove WebSocket client: sync, plain ws:// (no TLS), JSON control ops.
tungstenite = { version = "0.30", default-features = false, features = ["handshake"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Foxglove's protobuf schemas, as hand-written derive structs (no build script, no protoc).
prost = { version = "0.14", default-features = false, features = ["derive", "std"] }
# URDF parsing (robot models): a read-only XML DOM, no dependencies of its own.
roxmltree = "0.21.2"
# Camera images (JPEG, PNG): the same crate and codecs Rune already builds for its own images.
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
# glTF and GLB meshes for scene entities: the document and its accessors, without the importer's
# image decoding (textures aren't drawn); base64 for buffers embedded as data: URIs.
gltf = { version = "1.4", default-features = false, features = ["utils"] }
base64 = "0.22"

# Rune ships patched copies of these crates and asks every app that builds it to apply them too
# (a dependency's `[patch]` doesn't reach the workspace that depends on it). Same rev as `rune`.
[patch.crates-io]
wgpu-hal = { git = "https://github.com/anomalyco/rune", rev = "4a2e437954f01eaacc13c0515a1d39474dd6512c" }
winit = { git = "https://github.com/anomalyco/rune", rev = "4a2e437954f01eaacc13c0515a1d39474dd6512c" }
parley_engine = { git = "https://github.com/anomalyco/rune", rev = "4a2e437954f01eaacc13c0515a1d39474dd6512c" }
accesskit_windows = { git = "https://github.com/anomalyco/rune", rev = "4a2e437954f01eaacc13c0515a1d39474dd6512c" }
accesskit_macos = { git = "https://github.com/anomalyco/rune", rev = "4a2e437954f01eaacc13c0515a1d39474dd6512c" }

[profile.dev.package."*"]
opt-level = 2
